name: Clase 18 - Vite Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: "Clase 17/tres-en-raya"
        run: npm install

      - name: Vite build
        working-directory: "Clase 17/tres-en-raya"
        run: npm run build

      - name: Guardar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-web
          path: "Clase 17/tres-en-raya/dist"
          